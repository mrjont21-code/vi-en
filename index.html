<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>RTranslator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }

  /* Full screen app container - fills entire viewport */
  .app {
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* dynamic viewport height for mobile */
    display: flex;
    flex-direction: column;
    background: #111111;
  }

  /* Top area: 14/16 of height, split vertically (left-right) */
  .top-area {
    flex: 14;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 4%;
    overflow: hidden;
    position: relative;
    transition: opacity 0.3s, filter 0.3s;
    min-width: 0;
  }

  .panel-left {
    border-right: 1px solid rgba(255,255,255,0.06);
  }

  .panel.disabled {
    opacity: 0.15;
    filter: grayscale(1);
  }

  .panel.active {
    background: radial-gradient(ellipse at center, rgba(74,222,128,0.05), transparent 70%);
  }

  .lang-tag {
    font-size: clamp(12px, 3.5vw, 18px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 5%;
    opacity: 0.5;
    flex-shrink: 0;
  }

  .panel-left .lang-tag { color: #60a5fa; }
  .panel-right .lang-tag { color: #f97316; }

  .source-text {
    font-size: clamp(14px, 4.2vw, 22px);
    line-height: 1.35;
    color: #ffffff;
    overflow-y: auto;
    flex: 1;
    word-break: break-word;
    min-height: 0;
    margin-bottom: 4%;
  }

  .translated-text {
    font-size: clamp(12px, 3.6vw, 18px);
    line-height: 1.35;
    overflow-y: auto;
    flex: 1;
    word-break: break-word;
    opacity: 0.65;
    min-height: 0;
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 4%;
  }

  .panel-left .translated-text { color: #f97316; }
  .panel-right .translated-text { color: #60a5fa; }

  .source-text::-webkit-scrollbar, .translated-text::-webkit-scrollbar { width: 2px; }
  .source-text::-webkit-scrollbar-thumb, .translated-text::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 1px;
  }

  .text-chunk {
    display: block;
    margin-bottom: 0.35em;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Bottom area: 2/16 of height, controls */
  .bottom-area {
    flex: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10%;
    padding: 0 6%;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: #0d0d0d;
    flex-shrink: 0;
  }

  /* Toggle switches I/O style */
  .toggle {
    width: clamp(56px, 16vw, 90px);
    height: clamp(30px, 8.5vw, 48px);
    border-radius: 999px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: background 0.25s, box-shadow 0.25s;
    font-weight: 700;
    font-size: clamp(11px, 3vw, 16px);
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8%;
    flex-shrink: 0;
  }

  .toggle.on {
    background: #22c55e;
    box-shadow: 0 0 18px rgba(34,197,94,0.4);
    color: #ffffff;
  }

  .toggle.off {
    background: #dc2626;
    box-shadow: 0 0 14px rgba(220,38,38,0.2);
    color: rgba(255,255,255,0.5);
  }

  .toggle .knob {
    position: absolute;
    top: 12%;
    width: 36%;
    height: 76%;
    background: #ffffff;
    border-radius: 50%;
    transition: left 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  .toggle.on .knob { left: 58%; }
  .toggle.off .knob { left: 6%; }

  .toggle .lbl-on, .toggle .lbl-off {
    position: relative;
    z-index: 1;
  }

  .toggle.on .lbl-off { opacity: 0; }
  .toggle.off .lbl-on { opacity: 0; }

  /* Center play/stop circle button */
  .center-btn {
    width: clamp(54px, 15vw, 84px);
    height: clamp(54px, 15vw, 84px);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    position: relative;
    flex-shrink: 0;
  }

  .center-btn:active:not(:disabled) {
    transform: scale(0.95);
  }

  .center-btn.playing {
    background: #dc2626;
    box-shadow: 0 0 0 0 rgba(220,38,38,0.5);
    animation: pulse 1.6s ease-out infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.5); }
    70% { box-shadow: 0 0 0 16px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }

  .center-btn .icon-play {
    width: 0;
    height: 0;
    border-top: clamp(8px, 2.2vw, 14px) solid transparent;
    border-bottom: clamp(8px, 2.2vw, 14px) solid transparent;
    border-left: clamp(12px, 3.2vw, 20px) solid #ffffff;
    margin-left: 8%;
  }

  .center-btn .icon-stop {
    width: clamp(10px, 2.8vw, 18px);
    height: clamp(10px, 2.8vw, 18px);
    background: #ffffff;
    border-radius: 2px;
  }

  .center-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Status indicator bar */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: transparent;
  }

  .status-bar.active {
    background: linear-gradient(90deg, transparent, #22c55e, transparent);
    animation: slide 1s linear infinite;
    background-size: 200% 100%;
  }

  @keyframes slide {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>
<div class="app">
  
  <!-- Top 14/16 area: split vertically (left-right) -->
  <div class="top-area">
    
    <!-- Left panel: English source → Vietnamese translation -->
    <div class="panel panel-left" id="panelEn">
      <div class="status-bar" id="statusBarEn"></div>
      <div class="lang-tag">EN</div>
      <div class="source-text" id="enSource"></div>
      <div class="translated-text" id="viTarget"></div>
    </div>
    
    <!-- Right panel: Vietnamese source → English translation -->
    <div class="panel panel-right" id="panelVi">
      <div class="status-bar" id="statusBarVi"></div>
      <div class="lang-tag">VI</div>
      <div class="source-text" id="viSource"></div>
      <div class="translated-text" id="enTarget"></div>
    </div>
    
  </div>
  
  <!-- Bottom 2/16 area: controls -->
  <div class="bottom-area">
    
    <button class="toggle on" id="toggleEn" onclick="togglePanel('en')">
      <span class="knob"></span>
      <span class="lbl-on">I</span>
      <span class="lbl-off">O</span>
    </button>
    
    <button class="center-btn" id="centerBtn" onclick="togglePlay()">
      <span class="icon-play" id="centerIcon"></span>
    </button>
    
    <button class="toggle on" id="toggleVi" onclick="togglePanel('vi')">
      <span class="knob"></span>
      <span class="lbl-on">I</span>
      <span class="lbl-off">O</span>
    </button>
    
  </div>
  
</div>

<script>
(function() {
  'use strict';

  // ============ CONFIGURATION ============
  var MIN_DETECT_SECONDS = 2.0;
  var OVERLAP_SECONDS = 0.2;
  var CHUNK_SECONDS = MIN_DETECT_SECONDS + OVERLAP_SECONDS;
  var CHUNK_INTERVAL = MIN_DETECT_SECONDS;

  // ============ STATE ============
  var state = {
    isPlaying: false,
    enEnabled: true,
    viEnabled: true,
    stream: null,
    chunkTimer: null,
    processedTexts: new Map(),
    ttsQueue: [],
    isSpeaking: false,
    currentChunkEn: '',
    currentChunkVi: '',
    lastFinalEn: '',
    lastFinalVi: '',
    recognitionEn: null,
    recognitionVi: null,
    audioContext: null
  };

  // DOM
  var el = {
    panelEn: document.getElementById('panelEn'),
    panelVi: document.getElementById('panelVi'),
    toggleEn: document.getElementById('toggleEn'),
    toggleVi: document.getElementById('toggleVi'),
    centerBtn: document.getElementById('centerBtn'),
    centerIcon: document.getElementById('centerIcon'),
    enSource: document.getElementById('enSource'),
    viSource: document.getElementById('viSource'),
    enTarget: document.getElementById('enTarget'),
    viTarget: document.getElementById('viTarget'),
    statusBarEn: document.getElementById('statusBarEn'),
    statusBarVi: document.getElementById('statusBarVi')
  };

  // ============ TEXT SIMILARITY / DEDUP ============
  function fingerprint(t) {
    return t.toLowerCase().replace(/[\s.,!?;:'"-]/g, '').substring(0, 40);
  }

  function isDuplicate(lang, text) {
    var fp = fingerprint(text);
    if (fp.length < 4) return false;
    var set = state.processedTexts.get(lang);
    if (!set) return false;
    for (var e of set) {
      if (e.includes(fp) || fp.includes(e)) return true;
    }
    return false;
  }

  function markProcessed(lang, text) {
    var fp = fingerprint(text);
    if (fp.length < 4) return;
    if (!state.processedTexts.has(lang)) state.processedTexts.set(lang, new Set());
    state.processedTexts.get(lang).add(fp);
    var set = state.processedTexts.get(lang);
    if (set.size > 50) {
      var first = set.values().next().value;
      set.delete(first);
    }
  }

  function appendText(c, t) {
    var s = document.createElement('span');
    s.className = 'text-chunk';
    s.textContent = t;
    c.appendChild(s);
    c.scrollTop = c.scrollHeight;
  }

  // ============ TRANSLATION ============
  function translateText(text, sl, tl, cb) {
    if (!text || text.trim().length < 1) return;
    fetch('https://api.mymemory.translated.net/get?q=' + 
          encodeURIComponent(text.trim()) + '&langpair=' + sl + '|' + tl, 
          { cache: 'force-cache' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.responseData && d.responseData.translatedText) {
          cb(d.responseData.translatedText);
        }
      })
      .catch(function() {});
  }

  // ============ TTS QUEUE ============
  function speakText(lang, text) {
    if (!text || !('speechSynthesis' in window)) return;
    state.ttsQueue.push({ lang: lang, text: text });
    processTtsQueue();
  }

  function processTtsQueue() {
    if (state.isSpeaking || state.ttsQueue.length === 0) return;
    var item = state.ttsQueue.shift();
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(item.text);
      u.lang = item.lang === 'en' ? 'en-US' : 'vi-VN';
      u.rate = 0.95;
      u.onend = function() { state.isSpeaking = false; processTtsQueue(); };
      u.onerror = function() { state.isSpeaking = false; processTtsQueue(); };
      state.isSpeaking = true;
      window.speechSynthesis.speak(u);
    } catch(e) {
      state.isSpeaking = false;
      processTtsQueue();
    }
  }

  // ============ PROCESS CHUNK ============
  function processChunk(lang, text) {
    if (!text || text.trim().length < 2) return;
    if (isDuplicate(lang, text)) return;
    markProcessed(lang, text);

    if (lang === 'en') {
      if (!state.enEnabled) return;
      appendText(el.enSource, text);
      el.panelEn.classList.add('active');
      setTimeout(function() { el.panelEn.classList.remove('active'); }, 800);
      translateText(text, 'en', 'vi', function(tr) {
        appendText(el.viTarget, tr);
        speakText('vi', tr);
      });
    } else {
      if (!state.viEnabled) return;
      appendText(el.viSource, text);
      el.panelVi.classList.add('active');
      setTimeout(function() { el.panelVi.classList.remove('active'); }, 800);
      translateText(text, 'vi', 'en', function(tr) {
        appendText(el.enTarget, tr);
        speakText('en', tr);
      });
    }
  }

  // ============ SPEECH RECOGNITION ============
  function createRecognition(lang, onResult) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    var rec = new SR();
    rec.lang = lang;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = function(e) {
      var interim = '', finalText = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var tr = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += tr + ' ';
        else interim += tr;
      }
      onResult(finalText.trim(), interim, lang);
    };

    rec.onerror = function(e) {};
    rec.onend = function() {
      if (state.isPlaying) { try { rec.start(); } catch(e) {} }
    };

    return rec;
  }

  function handleRecognitionResult(finalText, interimText, lang) {
    if (lang === 'en') {
      state.currentChunkEn = finalText || interimText;
      if (finalText) state.lastFinalEn = finalText;
    } else {
      state.currentChunkVi = finalText || interimText;
      if (finalText) state.lastFinalVi = finalText;
    }
  }

  // ============ CHUNK-BASED PROCESSING ============
  function processTimeChunk() {
    var enText = state.lastFinalEn || state.currentChunkEn;
    var viText = state.lastFinalVi || state.currentChunkVi;
    var enLen = enText ? enText.trim().length : 0;
    var viLen = viText ? viText.trim().length : 0;
    var threshold = 3;

    if (enLen >= threshold && enLen >= viLen * 1.5) {
      processChunk('en', enText.trim());
    } else if (viLen >= threshold && viLen >= enLen * 1.5) {
      processChunk('vi', viText.trim());
    } else if (enLen >= threshold && viLen >= threshold) {
      var enDup = isDuplicate('en', enText);
      var viDup = isDuplicate('vi', viText);
      if (!enDup) processChunk('en', enText.trim());
      if (!viDup) processChunk('vi', viText.trim());
    }

    state.lastFinalEn = '';
    state.lastFinalVi = '';
    state.currentChunkEn = '';
    state.currentChunkVi = '';
  }

  function setupAudioVisualizer(stream) {
    try {
      state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
      var src = state.audioContext.createMediaStreamSource(stream);
      var an = state.audioContext.createAnalyser();
      an.fftSize = 256;
      src.connect(an);
    } catch(e) {}
  }

  // ============ TOGGLE PANELS ============
  window.togglePanel = function(side) {
    if (side === 'en') {
      state.enEnabled = !state.enEnabled;
      el.toggleEn.classList.toggle('on', state.enEnabled);
      el.toggleEn.classList.toggle('off', !state.enEnabled);
      el.panelEn.classList.toggle('disabled', !state.enEnabled);
    } else {
      state.viEnabled = !state.viEnabled;
      el.toggleVi.classList.toggle('on', state.viEnabled);
      el.toggleVi.classList.toggle('off', !state.viEnabled);
      el.panelVi.classList.toggle('disabled', !state.viEnabled);
    }
  };

  // ============ MAIN PLAY/STOP ============
  window.togglePlay = function() {
    if (state.isPlaying) stopPlayback();
    else startPlayback();
  };

  function startPlayback() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert('Please use Chrome or Edge browser.');
      return;
    }

    el.enSource.innerHTML = '';
    el.viSource.innerHTML = '';
    el.enTarget.innerHTML = '';
    el.viTarget.innerHTML = '';
    state.processedTexts.clear();
    state.ttsQueue = [];
    state.lastFinalEn = '';
    state.lastFinalVi = '';
    state.currentChunkEn = '';
    state.currentChunkVi = '';

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream) {
        state.stream = stream;
        state.isPlaying = true;

        el.centerBtn.classList.add('playing');
        el.centerIcon.className = 'icon-stop';
        el.statusBarEn.classList.add('active');
        el.statusBarVi.classList.add('active');

        setupAudioVisualizer(stream);

        if (state.enEnabled) {
          state.recognitionEn = createRecognition('en-US', handleRecognitionResult);
          try { state.recognitionEn.start(); } catch(e) {}
        }
        if (state.viEnabled) {
          state.recognitionVi = createRecognition('vi-VN', handleRecognitionResult);
          try { state.recognitionVi.start(); } catch(e) {}
        }

        state.chunkTimer = setTimeout(function firstChunk() {
          processTimeChunk();
          state.chunkTimer = setInterval(processTimeChunk, CHUNK_INTERVAL * 1000);
        }, CHUNK_SECONDS * 1000);
      })
      .catch(function(err) {
        alert('Microphone access denied: ' + err.message);
      });
  }

  function stopPlayback() {
    state.isPlaying = false;
    el.centerBtn.classList.remove('playing');
    el.centerIcon.className = 'icon-play';
    el.statusBarEn.classList.remove('active');
    el.statusBarVi.classList.remove('active');

    if (state.recognitionEn) {
      try { state.recognitionEn.stop(); } catch(e) {}
      state.recognitionEn = null;
    }
    if (state.recognitionVi) {
      try { state.recognitionVi.stop(); } catch(e) {}
      state.recognitionVi = null;
    }
    if (state.chunkTimer) {
      clearTimeout(state.chunkTimer);
      clearInterval(state.chunkTimer);
      state.chunkTimer = null;
    }
    if (state.stream) {
      state.stream.getTracks().forEach(function(t) { t.stop(); });
      state.stream = null;
    }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    state.ttsQueue = [];
    state.isSpeaking = false;
    if (state.audioContext) {
      try { state.audioContext.close(); } catch(e) {}
      state.audioContext = null;
    }
  }

  // Preload voices
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.getVoices();
    };
  }

  // Prevent iOS zoom on double-tap
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

})();
</script>
</body>
</html>
